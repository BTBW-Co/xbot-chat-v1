<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview · catálogo no xchat</title>
  <style>
    :root {
      --xbot-surface: #fff;
      --xbot-surface-alt: #f8fafc;
      --xbot-border: #e2e8f0;
      --xbot-ink: #0f172a;
      --xbot-text: #1e293b;
      --xbot-muted: #64748b;
      --xbot-theme: #2563eb;
      --xbot-theme-rgb: 37, 99, 235;
      --xbot-font: "Segoe UI", system-ui, sans-serif;
      --xbot-radius-lg: 16px;
      --xbot-radius-xl: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--xbot-font);
      background: #e8edf5;
      color: var(--xbot-ink);
      padding: 28px 16px 48px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 18px;
    }
    .lede {
      margin: 0 0 22px;
      color: #475569;
      font-size: 14px;
      max-width: 46rem;
    }
    .stage {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      align-items: flex-start;
    }
    .shot { display: flex; flex-direction: column; gap: 8px; }
    .shot > span {
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #64748b;
    }
    .xbot-chatbox {
      position: relative;
      width: 380px;
      height: 640px;
      background: var(--xbot-surface);
      border-radius: var(--xbot-radius-xl);
      border: 1px solid rgba(15, 23, 42, 0.06);
      box-shadow: 0 24px 64px rgba(15, 23, 42, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .xbot-chatbox.wide { width: 720px; height: 640px; }
    .xbot-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--xbot-border);
      box-shadow: inset 0 -2px 0 rgba(var(--xbot-theme-rgb), 0.85);
    }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: #dbeafe; color: #1d4ed8;
      display: grid; place-items: center; font-weight: 700;
    }
    .xbot-header-name { font-size: 14px; font-weight: 600; }
    .xbot-header-sub { font-size: 12px; color: var(--xbot-muted); }
    .xbot-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fff;
    }
    .xbot-message-row { display: flex; gap: 8px; max-width: 92%; }
    .xbot-message-row.user { align-self: flex-end; max-width: 85%; }
    .xbot-message-row.bot.xbot-message-row--catalog {
      max-width: 100%;
      width: 100%;
      align-self: stretch;
    }
    .xbot-message-row--catalog .xbot-message-col { flex: 1; width: 100%; }
    .xbot-message {
      padding: 10px 14px;
      border-radius: var(--xbot-radius-lg);
      font-size: 14px;
      line-height: 1.45;
      border: 1px solid var(--xbot-border);
    }
    .xbot-message.user {
      background: rgba(var(--xbot-theme-rgb), 0.12);
      border-color: rgba(var(--xbot-theme-rgb), 0.22);
      border-bottom-right-radius: 4px;
    }
    .xbot-message.bot {
      background: #fff;
      border-bottom-left-radius: 4px;
    }
    .xbot-message-row--catalog .xbot-message { overflow: visible; padding: 10px; width: 100%; }
    .xbot-text { container-type: inline-size; container-name: xbotcatalog; width: 100%; }
    .xbot-text p { margin: 0 0 0.55em; }
    .xbot-catalog-grid {
      display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      gap: 6px;
      width: 100%;
      margin: 8px 0;
    }
    @container xbotcatalog (min-width: 36rem) {
      .xbot-catalog-grid { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
    }
    .xbot-catalog-card {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--xbot-border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--xbot-surface-alt);
      min-width: 0;
    }
    .xbot-catalog-card--picked {
      border-color: rgba(var(--xbot-theme-rgb), 0.7);
      box-shadow: 0 0 0 2px rgba(var(--xbot-theme-rgb), 0.2);
    }
    .xbot-catalog-media { position: relative; flex-shrink: 0; cursor: zoom-in; }
    .xbot-catalog-img, .xbot-catalog-photo-fallback {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #e2e8f0;
    }
    .xbot-catalog-photo-fallback {
      display: flex; align-items: center; justify-content: center;
      color: #94a3b8; font-size: 11px;
    }
    .xbot-catalog-body {
      padding: 6px 6px 8px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .xbot-catalog-title {
      font-size: 12px; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .xbot-catalog-price { margin-top: 2px; font-size: 12px; font-weight: 700; }
    .xbot-catalog-desc { display: none !important; }
    .xbot-catalog-qty {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: auto; padding-top: 6px; gap: 2px;
    }
    .xbot-catalog-qty button {
      width: 28px; height: 28px; border-radius: 8px;
      border: 1px solid var(--xbot-border); background: #fff;
      font-size: 16px; line-height: 1; cursor: pointer; padding: 0;
    }
    .xbot-catalog-qty [data-qty-value] { font-weight: 700; font-size: 13px; min-width: 1.2em; text-align: center; }
    .xbot-catalog-detail .xbot-catalog-qty { margin-top: 16px; justify-content: flex-start; gap: 10px; }
    .xbot-catalog-detail .xbot-catalog-qty button { width: 40px; height: 40px; border-radius: 10px; font-size: 20px; }
    .xbot-catalog-detail .xbot-catalog-qty [data-qty-value] { font-size: 18px; min-width: 1.6em; }
    .xbot-catalog-detail {
      position: absolute; inset: 0; z-index: 8;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .xbot-catalog-detail[hidden] { display: none !important; }
    .xbot-catalog-detail-backdrop {
      position: absolute; inset: 0; border: 0; background: rgba(15, 23, 42, 0.45); cursor: pointer;
    }
    .xbot-catalog-detail-sheet {
      position: relative; z-index: 1; max-height: 88%; overflow: auto;
      background: #fff; border-radius: 18px 18px 0 0;
      box-shadow: 0 -12px 40px rgba(15, 23, 42, 0.18);
    }
    .xbot-catalog-detail-close {
      position: absolute; top: 10px; right: 10px; z-index: 2;
      width: 36px; height: 36px; border: 0; border-radius: 999px;
      background: #fff; font-size: 22px; cursor: pointer;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.2);
    }
    .xbot-catalog-detail-photo img {
      width: 100%; max-height: 280px; aspect-ratio: 4 / 3; object-fit: contain;
      display: block; background: #0f172a;
    }
    .xbot-catalog-detail-fallback {
      width: 100%; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center;
      background: #e2e8f0; color: #64748b;
    }
    .xbot-catalog-detail-body { padding: 14px 16px 18px; }
    .xbot-catalog-detail-title { margin: 0; font-size: 18px; }
    .xbot-catalog-detail-price { margin-top: 6px; font-size: 16px; font-weight: 700; }
    .xbot-catalog-detail-desc { margin: 10px 0 0; font-size: 14px; color: var(--xbot-muted); line-height: 1.45; }
    .xbot-catalog-detail-desc[hidden] { display: none !important; }
    .xbot-catalog-search {
      box-sizing: border-box; width: 100%; min-height: 44px; margin: 8px 0 4px;
      padding: 0 14px; border: 1px solid var(--xbot-border); border-radius: 12px;
      font: inherit; font-size: 16px;
    }
    .xbot-catalog-dock {
      position: sticky; bottom: 0; z-index: 2;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-top: 8px; padding: 10px; border-radius: 14px;
      background: #fff; border: 1px solid var(--xbot-border);
      box-shadow: 0 -6px 16px rgba(15, 23, 42, 0.06);
    }
    .xbot-catalog-dock-meta { display: flex; flex-direction: column; font-size: 12px; color: var(--xbot-muted); }
    .xbot-catalog-dock-meta strong { font-size: 15px; color: var(--xbot-ink); }
    .xbot-catalog-close {
      min-height: 44px; padding: 0 14px; border: 0; border-radius: 12px;
      background: var(--xbot-theme); color: #fff; font-weight: 700; font-size: 14px;
    }
    .xbot-compose {
      display: flex; gap: 8px; padding: 10px 12px 14px; border-top: 1px solid var(--xbot-border);
    }
    .xbot-compose input {
      flex: 1; min-height: 40px; border-radius: 12px; border: 1px solid var(--xbot-border);
      padding: 0 12px; font: inherit;
    }
    .xbot-compose button {
      border: 0; border-radius: 12px; background: var(--xbot-theme); color: #fff;
      padding: 0 14px; font-weight: 700;
    }
  </style>
</head>
<body>
  <h1>Catálogo dentro da conversa</h1>
  <p class="lede">Três itens por linha no xchat, quatro quando a conversa é larga. O card mostra título, preço e quantidade. A foto abre o detalhe.</p>
  <div class="stage">
    <div class="shot">
      <span>XChat · 380px</span>
      <section class="xbot-chatbox" id="narrow"></section>
    </div>
    <div class="shot">
      <span>Conversa larga · 720px</span>
      <section class="xbot-chatbox wide" id="wide"></section>
    </div>
  </div>
  <template id="thread">
    <header class="xbot-header">
      <div class="avatar">B</div>
      <div>
        <div class="xbot-header-name">Boteco da Praça</div>
        <div class="xbot-header-sub">online</div>
      </div>
    </header>
    <div class="xbot-messages">
      <div class="xbot-message-row user">
        <div class="xbot-message user">Quero ver o cardápio</div>
      </div>
      <div class="xbot-message-row bot xbot-message-row--catalog">
        <div class="xbot-message-col">
          <div class="xbot-message bot">
            <div class="xbot-text xbot-catalog-basket">
              <p>Encontrei estas opções no catálogo:</p>
              <input class="xbot-catalog-search" type="search" placeholder="Buscar no cardápio" aria-label="Buscar no cardápio" />
              <div class="xbot-catalog-grid" data-xbot="catalog-grid">
                <article class="xbot-catalog-card xbot-catalog-card--picked" data-xbot-card="catalog">
                  <div class="xbot-catalog-media" role="button" tabindex="0" aria-label="Ver detalhes"><img class="xbot-catalog-img" alt="Picanha" src="https://images.unsplash.com/photo-1558030006-450675393462?auto=format&fit=crop&w=480&q=60" /></div>
                  <div class="xbot-catalog-body">
                    <div class="xbot-catalog-title"><strong>Picanha na brasa</strong></div>
                    <div class="xbot-catalog-price"><strong>R$ 89,00</strong></div>
                    <div class="xbot-catalog-desc">Grelhada no ponto, com farofa e vinagrete.</div>
                    <div class="xbot-catalog-qty"><button type="button" aria-label="Diminuir">−</button><span data-qty-value>1</span><button type="button" aria-label="Aumentar">+</button></div>
                  </div>
                </article>
                <article class="xbot-catalog-card" data-xbot-card="catalog">
                  <div class="xbot-catalog-media" role="button" tabindex="0" aria-label="Ver detalhes"><img class="xbot-catalog-img" alt="Moqueca" src="https://images.unsplash.com/photo-1535399831218-d5bd36d1a6b3?auto=format&fit=crop&w=480&q=60" /></div>
                  <div class="xbot-catalog-body">
                    <div class="xbot-catalog-title"><strong>Moqueca de camarão</strong></div>
                    <div class="xbot-catalog-price"><strong>R$ 72,00</strong></div>
                    <div class="xbot-catalog-desc">Leite de coco, azeite de dendê e arroz.</div>
                    <div class="xbot-catalog-qty"><button type="button">−</button><span data-qty-value>0</span><button type="button">+</button></div>
                  </div>
                </article>
                <article class="xbot-catalog-card" data-xbot-card="catalog">
                  <div class="xbot-catalog-media" role="button" tabindex="0" aria-label="Ver detalhes"><div class="xbot-catalog-photo-fallback">Sem foto</div></div>
                  <div class="xbot-catalog-body">
                    <div class="xbot-catalog-title"><strong>Caipirinha de limão</strong></div>
                    <div class="xbot-catalog-price"><strong>R$ 18,00</strong></div>
                    <div class="xbot-catalog-desc">Limão, cachaça e gelo.</div>
                    <div class="xbot-catalog-qty"><button type="button">−</button><span data-qty-value>0</span><button type="button">+</button></div>
                  </div>
                </article>
                <article class="xbot-catalog-card" data-xbot-card="catalog">
                  <div class="xbot-catalog-media" role="button" tabindex="0" aria-label="Ver detalhes"><img class="xbot-catalog-img" alt="Pudim" src="https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=480&q=60" /></div>
                  <div class="xbot-catalog-body">
                    <div class="xbot-catalog-title"><strong>Pudim de leite</strong></div>
                    <div class="xbot-catalog-price"><strong>R$ 16,00</strong></div>
                    <div class="xbot-catalog-desc">Calda de caramelo, fatia individual.</div>
                    <div class="xbot-catalog-qty"><button type="button">−</button><span data-qty-value>0</span><button type="button">+</button></div>
                  </div>
                </article>
              </div>
              <div class="xbot-catalog-dock">
                <div class="xbot-catalog-dock-meta"><strong>1 item</strong><span>R$ 89,00</span></div>
                <button type="button" class="xbot-catalog-close">Fechar pedido</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <form class="xbot-compose" onsubmit="return false">
      <input placeholder="Escreva uma mensagem" aria-label="Mensagem" />
      <button type="button">Enviar</button>
    </form>
  </template>
  <script>
    var tpl = document.getElementById('thread');
    document.getElementById('narrow').appendChild(tpl.content.cloneNode(true));
    document.getElementById('wide').appendChild(tpl.content.cloneNode(true));

    document.querySelectorAll('.xbot-chatbox').forEach(function (box) {
      var sheet = document.createElement('div');
      sheet.className = 'xbot-catalog-detail';
      sheet.hidden = true;
      sheet.innerHTML =
        '<button type="button" class="xbot-catalog-detail-backdrop" aria-label="Fechar"></button>' +
        '<div class="xbot-catalog-detail-sheet" role="dialog" aria-modal="true">' +
        '<button type="button" class="xbot-catalog-detail-close" aria-label="Fechar">×</button>' +
        '<div class="xbot-catalog-detail-photo"></div>' +
        '<div class="xbot-catalog-detail-body">' +
        '<h3 class="xbot-catalog-detail-title"></h3>' +
        '<div class="xbot-catalog-detail-price"></div>' +
        '<p class="xbot-catalog-detail-desc" hidden></p>' +
        '<div class="xbot-catalog-qty">' +
        '<button type="button" data-qty="minus" aria-label="Diminuir">−</button>' +
        '<span data-qty-value>0</span>' +
        '<button type="button" data-qty="plus" aria-label="Aumentar">+</button>' +
        '</div></div></div>';
      box.appendChild(sheet);
      function qtyOf(card) {
        var n = parseInt(card.getAttribute('data-xbot-qty') || '0', 10);
        return isNaN(n) ? 0 : n;
      }
      function setQty(card, next) {
        next = Math.max(0, Math.min(99, next));
        card.setAttribute('data-xbot-qty', String(next));
        var label = card.querySelector('.xbot-catalog-body [data-qty-value]');
        if (label) label.textContent = String(next);
        card.classList.toggle('xbot-catalog-card--picked', next > 0);
        if (sheet._card === card) {
          sheet.querySelector('[data-qty-value]').textContent = String(next);
        }
        var units = 0;
        box.querySelectorAll('.xbot-catalog-card').forEach(function (item) { units += qtyOf(item); });
        var count = box.querySelector('.xbot-catalog-dock-meta strong');
        if (count) count.textContent = units === 0 ? 'Nenhum item' : (units === 1 ? '1 item' : units + ' itens');
      }
      function openDetail(card) {
        var photo = sheet.querySelector('.xbot-catalog-detail-photo');
        photo.textContent = '';
        var img = card.querySelector('.xbot-catalog-img');
        if (img && img.getAttribute('src')) {
          var big = document.createElement('img');
          big.src = img.getAttribute('src');
          big.alt = img.alt || '';
          photo.appendChild(big);
        } else {
          var fallback = document.createElement('div');
          fallback.className = 'xbot-catalog-detail-fallback';
          fallback.textContent = 'Sem foto';
          photo.appendChild(fallback);
        }
        sheet.querySelector('.xbot-catalog-detail-title').textContent =
          (card.querySelector('.xbot-catalog-title') || {}).textContent || '';
        sheet.querySelector('.xbot-catalog-detail-price').textContent =
          (card.querySelector('.xbot-catalog-price') || {}).textContent || '';
        var desc = card.querySelector('.xbot-catalog-desc');
        var descOut = sheet.querySelector('.xbot-catalog-detail-desc');
        descOut.textContent = desc ? desc.textContent.trim() : '';
        descOut.hidden = !descOut.textContent;
        sheet._card = card;
        sheet.hidden = false;
        setQty(card, qtyOf(card));
      }
      sheet.querySelector('.xbot-catalog-detail-backdrop').addEventListener('click', function () {
        sheet.hidden = true;
      });
      sheet.querySelector('.xbot-catalog-detail-close').addEventListener('click', function () {
        sheet.hidden = true;
      });
      sheet.querySelector('.xbot-catalog-qty').addEventListener('click', function (ev) {
        var btn = ev.target.closest('button');
        if (!btn || !sheet._card) return;
        ev.stopPropagation();
        var delta = btn.getAttribute('data-qty') === 'minus' ? -1 : 1;
        setQty(sheet._card, qtyOf(sheet._card) + delta);
      });
      box.querySelectorAll('.xbot-catalog-card').forEach(function (card) {
        var current = card.querySelector('[data-qty-value]');
        card.setAttribute('data-xbot-qty', current ? current.textContent.trim() : '0');
        var media = card.querySelector('.xbot-catalog-media');
        if (media) {
          media.addEventListener('click', function (ev) {
            ev.stopPropagation();
            openDetail(card);
          });
        }
        var qty = card.querySelector('.xbot-catalog-qty');
        if (qty) {
          qty.addEventListener('click', function (ev) {
            var btn = ev.target.closest('button');
            if (!btn) return;
            ev.stopPropagation();
            var delta = btn.getAttribute('data-qty') === 'minus' ? -1 : 1;
            setQty(card, qtyOf(card) + delta);
          });
        }
      });
    });
  </script>
</body>
</html>
